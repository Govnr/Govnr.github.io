---
layout: default
---

<article class="page">
  <header class="page-header">
    <p class="eyebrow">{{ page.eyebrow | default: "Govnr" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.lede %}
      <p class="lede">{{ page.lede }}</p>
    {% endif %}
  </header>

  <div class="content">
    {{ content }}
  </div>
</article>
